{% extends 'Home/main.html' %}
{% load static %}

{% block main %}

<!-- Whats New Start -->
<section class="whats-news-area pt-50 pb-20">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="row d-flex justify-content-between">
            <div class="col-lg-6 col-md-6">
              <div class="section-tittle mb-30">
                <h3>Search Keyword: <span style="color: red;"> {{ keyword }}</span></h3>
                
                </h3>
              </div>
            </div>
            <div class="col-lg-9 col-md-9">
              
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <!-- Nav Card -->
              <div class="tab-content" id="nav-tabContent">
                <!-- card one -->
                <div class="tab-pane fade show active" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab">
                  <div class="whats-news-caption">
                    <div class="row">
                      {% if articles %}
                        {% for n in articles %}
                          <div class="col-lg-6 col-md-6 {{ n.category }}">
                            <div class="single-what-news mb-100">
                              <div class="what-img">
                                <img src="{{ n.news_image.url }}" height="350px" width="250px" alt="{{ n.news_image.url }}" />
                              </div>
                              <div class="what-cap">
                                <span class="color1">{{ n.category }}</span>
                                <h4><a href="{% url 'details' n.id %}">{{ n.title|truncatechars:40 }}</a></h4>
                              </div>
                            </div>
                          </div>
                        {% endfor %}
                      {% else %}
                        <tr>
                          <td colspan="6" class="center">Search Keyword Not found</td>
                        </tr>
                      {% endif %}
                    </div>
                  </div>
                </div>
              </div>
              <!-- End Nav Card -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- Whats New End -->

{% endblock main %}
